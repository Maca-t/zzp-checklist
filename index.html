      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>

    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
  
<style>
  #knmt-laadscherm {
    position: fixed; inset: 0; z-index: 99999; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.4s ease;
  }
  #knmt-laadscherm.weg { opacity: 0; pointer-events: none; }
  .knmt-icoon { width: 64px; height: 64px; object-fit: contain; animation: knmt-puls 1.1s ease-in-out infinite; }
  .knmt-ruit  { width: 46px; height: 46px; background: #566AB0; border-radius: 6px;
                animation: knmt-ruit 1.1s ease-in-out infinite; }
  .knmt-tekst { margin-top: 18px; font-family: "Sofia Pro", Verdana, Arial, sans-serif;
                font-size: 13px; color: #566a90; letter-spacing: 0.03em; }
  @keyframes knmt-puls { 0%, 100% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.05); opacity: 1; } }
  @keyframes knmt-ruit { 0%, 100% { transform: rotate(45deg) scale(0.85); opacity: 0.55; }
                         50% { transform: rotate(45deg) scale(1.05); opacity: 1; } }
</style>
<script>
  // Tabbladnaam vastzetten (shinylive zet anders "Shiny App")
  (function () {
    var T = "ZZP Checklist";
    function zet() { if (document.title !== T) document.title = T; }
    zet();
    // extra vangnet: de eerste 2 minuten elke seconde controleren
    var n = 0, t = setInterval(function () { zet(); if (++n > 120) clearInterval(t); }, 1000);
    window.addEventListener("message", zet);
    document.addEventListener("DOMContentLoaded", function () {
      zet();
      new MutationObserver(zet).observe(document.head, { childList: true, subtree: true, characterData: true });
    });
  })();
  (function () {
    function weg() {
      var el = document.getElementById("knmt-laadscherm");
      if (!el || el.classList.contains("weg")) return;
      el.classList.add("weg");
      setTimeout(function () { el.style.display = "none"; }, 450);
    }
    // De app stuurt dit bericht zodra hij klaar is
    window.addEventListener("message", function (e) {
      if (e.data === "checklist-klaar") {
        weg();
        // Staat de site zelf in een iframe (bijv. op knmt.nl)? Geef het seintje door.
        if (window.parent !== window) {
          try { window.parent.postMessage("checklist-klaar", "*"); } catch (err) {}
        }
      }
    });
    // Tweede route: zodra shinylive het app-venster (iframe) heeft geladen,
    // is de app in beeld. Werkt ook als app.R het seintje niet stuurt.
    function volgFrames() {
      var root = document.getElementById("root") || document.body;
      function koppel(f) {
        if (f.dataset.knmtGevolgd) return;
        f.dataset.knmtGevolgd = "1";
        f.addEventListener("load", function () {
          var src = f.getAttribute("src") || "";
          if (src && src !== "about:blank") setTimeout(weg, 1500);
        });
      }
      function zoek() { root.querySelectorAll("iframe").forEach(koppel); }
      zoek();
      new MutationObserver(zoek).observe(root, { childList: true, subtree: true });
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", volgFrames);
    } else { volgFrames(); }
    // Laatste vangnet: na 60 seconden altijd weghalen
    setTimeout(weg, 60000);
  })();
</script>
