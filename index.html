<script>
document.addEventListener("shiny:connected", function() {
  var el = document.getElementById("boot_overlay");
  if (el) {
    el.style.opacity = "0";
    setTimeout(function(){ el.style.display = "none"; }, 450);
  }
});
// Vangnet: verberg sowieso na 20 sec, mocht shiny:connected niet afgaan
setTimeout(function() {
  var el = document.getElementById("boot_overlay");
  if (el) { el.style.opacity = "0"; setTimeout(function(){ el.style.display = "none"; }, 450); }
}, 20000);
</script>
